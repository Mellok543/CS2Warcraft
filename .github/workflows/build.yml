name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CS2Warcraft.slnx

      - name: Build
        run: dotnet build CS2Warcraft.slnx -c Release --no-restore

      - name: Test
        run: dotnet test CS2Warcraft.slnx -c Release --no-build

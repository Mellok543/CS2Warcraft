name: build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore CS2Warcraft.slnx

      - name: Build
        run: dotnet build CS2Warcraft.slnx -c Release --no-restore

      - name: Test
        run: dotnet test CS2Warcraft.slnx -c Release --no-build

      - name: Verify server layout
        run: |
          root=artifacts/addons/counterstrikesharp
          test -f $root/shared/Warcraft.Api/Warcraft.Api.dll
          for module in Core Database Races Abilities Menu Admin Vip Shop Achievements Rtv Loadouts Cosmetics; do
            test -f $root/plugins/Warcraft.$module/Warcraft.$module.dll || { echo "Missing Warcraft.$module" >&2; exit 1; }
          done
          test -f $root/plugins/Warcraft.Database/MySqlConnector.dll
          test -f $root/plugins/Warcraft.Shop/defaults/shop.json
          test -f $root/plugins/Warcraft.Rtv/defaults/maplist.txt
          test -f $root/plugins/Warcraft.Loadouts/defaults/race_loadouts.json
          test "$(ls $root/plugins/Warcraft.Races/defaults/races/*.json | wc -l)" -ge 3
          if find $root/plugins -name 'Warcraft.Api.dll' -o -name 'CounterStrikeSharp.API.dll' | grep -q .; then
            echo "Plugin folders must not contain Warcraft.Api.dll or CounterStrikeSharp.API.dll" >&2
            exit 1
          fi

      - name: Read version
        id: version
        run: echo "value=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)" >> "$GITHUB_OUTPUT"

      - name: Upload server layout
        uses: actions/upload-artifact@v4
        with:
          name: cs2warcraft-${{ steps.version.outputs.value }}
          path: artifacts/addons/counterstrikesharp/
